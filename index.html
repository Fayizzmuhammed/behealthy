<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
  :root {
    --navy: #030d2b;
    --blue: #0a2472;
    --blue-mid: #123a9c;
    --blue-glow: #2563eb;
    --green: #a7f3c0;
    --green-hover: #c2f8d3;
    --green-text: #06331a;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }

  body {
    background: linear-gradient(160deg, var(--navy) 0%, var(--blue) 55%, var(--blue-mid) 100%);
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: #fff;
    overflow: hidden;
    position: relative;
  }

  /* Minimal background: two slow light orbs + faint grid */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(70px);
    pointer-events: none;
    animation: float 16s ease-in-out infinite alternate;
  }
  .orb.one {
    width: 60vmax; height: 60vmax;
    top: -22vmax; left: -18vmax;
    background: radial-gradient(circle, var(--blue-glow), transparent 68%);
    opacity: .4;
  }
  .orb.two {
    width: 50vmax; height: 50vmax;
    bottom: -20vmax; right: -16vmax;
    background: radial-gradient(circle, #4f8bff, transparent 68%);
    opacity: .22;
    animation-delay: -8s;
  }
  @keyframes float {
    from { transform: translate3d(0,0,0) scale(1); }
    to   { transform: translate3d(5vmax,3vmax,0) scale(1.12); }
  }
  .grid {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(circle at center, #000 25%, transparent 75%);
            mask-image: radial-gradient(circle at center, #000 25%, transparent 75%);
    pointer-events: none;
  }

  .stage {
    position: relative;
    z-index: 1;
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .stack {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .btn {
    position: relative;
    display: block;
    width: 100%;
    padding: 20px 32px;
    border: 0;
    border-radius: 16px;
    background: var(--green);
    color: var(--green-text);
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    line-height: 1;
    text-align: center;
    text-decoration: none;
    letter-spacing: .01em;
    cursor: pointer;
    overflow: hidden;
    opacity: 0;
    animation: rise .7s cubic-bezier(.2,.8,.2,1) forwards,
               pulse 2.6s ease-out infinite;
    transition: transform .2s ease, background .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:nth-child(1) { animation-delay: .1s, .8s; }
  .btn:nth-child(2) { animation-delay: .25s, 1.1s; }

  .btn:hover { background: var(--green-hover); transform: translateY(-2px) scale(1.02); }
  .btn:active { transform: scale(.97); }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }

  /* soft light sweep */
  .btn::after {
    content: "";
    position: absolute;
    top: 0; left: -60%;
    width: 40%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.7), transparent);
    transform: skewX(-20deg);
    animation: sweep 3.4s ease-in-out infinite;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(26px) scale(.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes sweep {
    0%, 55% { left: -60%; }
    100%    { left: 130%; }
  }
  @keyframes pulse {
    0%   { box-shadow: 0 10px 30px rgba(0,0,0,.35), 0 0 0 0 rgba(167,243,192,.5); }
    70%  { box-shadow: 0 10px 30px rgba(0,0,0,.35), 0 0 0 20px rgba(167,243,192,0); }
    100% { box-shadow: 0 10px 30px rgba(0,0,0,.35), 0 0 0 0 rgba(167,243,192,0); }
  }


  /* Thank-you screen */
  .thanks {
    display: none;
    text-align: center;
    width: 100%;
    max-width: 420px;
  }
  body.done .stack { display: none; }
  body.done .thanks { display: block; animation: rise .7s cubic-bezier(.2,.8,.2,1) both; }
  .ring-wrap {
    position: relative;
    width: 108px; height: 108px;
    margin: 0 auto 28px;
  }
  .ring { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring-track, .ring-progress {
    fill: none; cx: 50; cy: 50; r: 44;
    stroke-width: 5;
  }
  .ring-track { stroke: rgba(255,255,255,.12); }
  .ring-progress {
    stroke: var(--green);
    stroke-linecap: round;
    stroke-dasharray: 276.5;
    stroke-dashoffset: 276.5;
    filter: drop-shadow(0 0 6px rgba(167,243,192,.7));
  }
  body.done .ring-progress { animation: ringfill 3s linear forwards; }
  @keyframes ringfill { to { stroke-dashoffset: 0; } }

  .check {
    position: absolute;
    inset: 12px;
    border-radius: 50%;
    background: var(--green);
    display: grid; place-items: center;
    box-shadow: 0 0 24px rgba(167,243,192,.55);
    animation: breathe 2.2s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.05); }
  }
  .check svg { width: 38px; height: 38px; }
  .check path {
    stroke: var(--green-text); stroke-width: 5; fill: none;
    stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 60; stroke-dashoffset: 60;
    animation: draw .6s .3s ease-out forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .thanks h1 {
    margin: 0 0 8px;
    font-size: 2.1rem;
    font-weight: 800;
    letter-spacing: .01em;
    background: linear-gradient(90deg, #fff, #cfe0ff, #fff);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 2.5s linear infinite;
  }
  @keyframes shine {
    to { background-position: 200% center; }
  }
  .thanks .status {
    margin: 0;
    font-size: .95rem;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: rgba(255,255,255,.6);
  }
  .bar {
    margin: 26px auto 0;
    width: 200px; height: 4px;
    border-radius: 4px;
    background: rgba(255,255,255,.14);
    overflow: hidden;
  }
  .bar i {
    display: block; height: 100%; width: 100%;
    background: var(--green);
    box-shadow: 0 0 10px rgba(167,243,192,.8);
    transform-origin: left;
    transform: scaleX(0);
  }
  body.done .bar i { animation: fill 3s linear forwards; }
  @keyframes fill { to { transform: scaleX(1); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .btn { opacity: 1; }
    body.done .bar i { animation: fill 3s linear forwards !important; }
    body.done .ring-progress { animation: ringfill 3s linear forwards !important; }
    .check path { stroke-dashoffset: 0; }
  }
</style>
</head>
<body>
  <div class="orb one"></div>
  <div class="orb two"></div>
  <div class="grid"></div>

  <main class="stage">
    <div class="stack">
      <a class="btn" href="https://t.me/+4XEDjvtaDko4M2Nl" data-btn="1">Click Here</a>
      <a class="btn" href="https://t.me/+4XEDjvtaDko4M2Nl" data-btn="2">Click Here</a>
    </div>

    <div class="thanks" role="status" aria-live="polite">
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 100 100">
          <circle class="ring-track" cx="50" cy="50" r="44"></circle>
          <circle class="ring-progress" cx="50" cy="50" r="44"></circle>
        </svg>
        <div class="check">
          <svg viewBox="0 0 52 52"><path d="M14 27 l9 9 l17 -19"/></svg>
        </div>
      </div>
      <h1>Welcome</h1>
      <p class="status" id="statusLine">Connecting</p>
      <div class="bar"><i></i></div>
    </div>
  </main>

<script>
  var LINK = "https://t.me/+4XEDjvtaDko4M2Nl";
  var clicked = false;

  document.querySelectorAll('.btn').forEach(function (b) {
    b.addEventListener('click', function (e) {
      e.preventDefault();
      if (clicked) return;
      clicked = true;

      // Track the click with Meta Pixel (if loaded)
      try { if (window.fbq) fbq('track', 'Lead'); } catch (err) {}

      // Show thank-you screen, redirect after 5 seconds
      document.body.classList.add('done');
      setTimeout(function () { window.location.href = LINK; }, 3000);
    });
  });
</script>
</body>
</html>
