<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
  :root {
    --navy: #030d2b;
    --blue: #0a2472;
    --blue-mid: #123a9c;
    --blue-glow: #2563eb;
    --green: #a7f3c0;
    --green-hover: #c2f8d3;
    --green-text: #06331a;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }

  body {
    background: linear-gradient(160deg, var(--navy) 0%, var(--blue) 55%, var(--blue-mid) 100%);
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: #fff;
    overflow: hidden;
    position: relative;
  }

  /* Minimal background: two slow light orbs + faint grid */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(70px);
    pointer-events: none;
    animation: float 16s ease-in-out infinite alternate;
  }
  .orb.one {
    width: 60vmax; height: 60vmax;
    top: -22vmax; left: -18vmax;
    background: radial-gradient(circle, var(--blue-glow), transparent 68%);
    opacity: .4;
  }
  .orb.two {
    width: 50vmax; height: 50vmax;
    bottom: -20vmax; right: -16vmax;
    background: radial-gradient(circle, #4f8bff, transparent 68%);
    opacity: .22;
    animation-delay: -8s;
  }
  @keyframes float {
    from { transform: translate3d(0,0,0) scale(1); }
    to   { transform: translate3d(5vmax,3vmax,0) scale(1.12); }
  }
  .grid {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(circle at center, #000 25%, transparent 75%);
            mask-image: radial-gradient(circle at center, #000 25%, transparent 75%);
    pointer-events: none;
  }

  .stage {
    position: relative;
    z-index: 1;
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .stack {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .btn {
    position: relative;
    display: block;
    width: 100%;
    padding: 20px 32px;
    border: 0;
    border-radius: 16px;
    background: var(--green);
    color: var(--green-text);
    font-family: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    line-height: 1;
    text-align: center;
    text-decoration: none;
    letter-spacing: .01em;
    cursor: pointer;
    overflow: hidden;
    opacity: 0;
    animation: rise .7s cubic-bezier(.2,.8,.2,1) forwards,
               pulse 2.6s ease-out infinite;
    transition: transform .2s ease, background .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:nth-child(1) { animation-delay: .1s, .8s; }
  .btn:nth-child(2) { animation-delay: .25s, 1.1s; }

  .btn:hover { background: var(--green-hover); transform: translateY(-2px) scale(1.02); }
  .btn:active { transform: scale(.97); }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }

  .btn .label { transition: opacity .2s ease; }
  .btn .redirecting {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn.sending .label,
  .btn.sending .arrow { display: none; }
  .btn.sending .redirecting { display: inline-flex; }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(6,51,26,.25);
    border-top-color: var(--green-text);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .arrow {
    display: inline-block;
    margin-left: 6px;
    animation: nudge 1.2s ease-in-out infinite;
  }
  @keyframes nudge {
    0%, 100% { transform: translateX(0); }
    50%      { transform: translateX(6px); }
  }

  /* soft light sweep */
  .btn::after {
    content: "";
    position: absolute;
    top: 0; left: -60%;
    width: 40%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.7), transparent);
    transform: skewX(-20deg);
    animation: sweep 3.4s ease-in-out infinite;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(26px) scale(.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes sweep {
    0%, 55% { left: -60%; }
    100%    { left: 130%; }
  }
  @keyframes pulse {
    0%   { box-shadow: 0 10px 30px rgba(0,0,0,.35), 0 0 0 0 rgba(167,243,192,.5); }
    70%  { box-shadow: 0 10px 30px rgba(0,0,0,.35), 0 0 0 20px rgba(167,243,192,0); }
    100% { box-shadow: 0 10px 30px rgba(0,0,0,.35), 0 0 0 0 rgba(167,243,192,0); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .btn { opacity: 1; }
  }

  .countdown {
    margin: 4px 0 0;
    text-align: center;
    font-size: .9rem;
    font-weight: 600;
    letter-spacing: .04em;
    color: rgba(255,255,255,.6);
  }

  .copy {
    text-align: center;
    margin-bottom: 8px;
    animation: rise .7s cubic-bezier(.2,.8,.2,1) both;
  }
  .headline {
    margin: 0 0 10px;
    font-size: 1.9rem;
    font-weight: 800;
    letter-spacing: .01em;
    background: linear-gradient(90deg, #fff, #cfe0ff, #fff);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 2.5s linear infinite;
  }
  @keyframes shine { to { background-position: 200% center; } }
  .subhead {
    margin: 0 0 8px;
    font-size: 1.05rem;
    line-height: 1.5;
    color: rgba(255,255,255,.85);
  }
  .microcopy {
    margin: 0 0 18px;
    font-size: .85rem;
    font-weight: 600;
    letter-spacing: .02em;
    color: var(--green);
  }
  .fallback {
    margin: 14px 0 0;
    text-align: center;
    font-size: .85rem;
    color: rgba(255,255,255,.55);
  }
  .fallback a {
    color: var(--green);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
</style>
</head>
<body>
  <div class="orb one"></div>
  <div class="orb two"></div>
  <div class="grid"></div>

  <main class="stage">
    <div class="stack">
      <div class="copy">
        <h1 class="headline">You're Almost In 🎉</h1>
        <p class="subhead">Join our private Telegram community for exclusive updates, tips, and offers you won't find anywhere else.</p>
        <p class="microcopy">Tap below to join instantly — it takes 5 seconds.</p>
      </div>
      <a class="btn" href="https://t.me/+4XEDjvtaDko4M2Nl" data-btn="1" rel="noopener" data-tg="1">
        <span class="label">Click Here</span><span class="arrow">&#8594;</span>
        <span class="redirecting"><span class="spinner"></span>Redirecting...</span>
      </a>
      <a class="btn" href="https://t.me/+4XEDjvtaDko4M2Nl" data-btn="2" rel="noopener" data-tg="1">
        <span class="label">Click Here</span><span class="arrow">&#8594;</span>
        <span class="redirecting"><span class="spinner"></span>Redirecting...</span>
      </a>
      <p class="fallback">Link not opening? <a href="https://t.me/+4XEDjvtaDko4M2Nl">Tap here instead</a></p>
    </div>

  </main>

<script>
  // Plain, reliable navigation — the button's own href (a t.me invite link)
  // does the work. No deep-link tricks: tg://resolve only works for public
  // usernames, not private invite-link hashes like this one, and using it
  // caused a "Username not found" error. Keeping this simple is correct.
  document.querySelectorAll('a[data-tg]').forEach(function (b) {
    b.addEventListener('click', function () {
      try { if (window.fbq) fbq('track', 'Lead'); } catch (err) {}
    });
  });
</script>
</body>
</html>
